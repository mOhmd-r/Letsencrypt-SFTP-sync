name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y shellcheck ripgrep

      - name: Validate Bash syntax
        run: find . -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: Run ShellCheck
        run: find . -type f -name '*.sh' -print0 | xargs -0 -r shellcheck -x

      - name: Run policy tests
        run: bash tests/static.sh
